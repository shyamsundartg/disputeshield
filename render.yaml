# One-click deploy on Render's free plan (Blueprint).
# Opens on demo data. If PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET are added in the
# Render dashboard, a "Live PayPal sandbox" switch appears, view-only for visitors.
services:
  - type: web
    name: disputeshield
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix web install --include=dev && npm --prefix web run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: LIVE_READ_ONLY
        value: "true"
